<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa Mia — домашняя еда в Анталии</title>
  <meta name="description" content="Casa Mia — домашняя кухня в Анталии. Пельмени, равиоли, голубцы, блинчики, салаты и доставка.">
  <meta property="og:title" content="Casa Mia Home Food">
  <meta property="og:description" content="Домашняя еда с любовью. Доставка по Анталии.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/brand/card.png">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top">
        <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><path fill="currentColor" d="M20 6 6 18h3v14h8V22h6v10h8V18h3L20 6zm0 4.5 10 8.2V30h-4V20h-12v10h-4V18.7l10-8.2z"/><circle cx="20" cy="8" r="2"/></svg>
        Casa Mia
      </a>
      <nav class="nav-desktop" aria-label="Main">
        <a href="#menu" data-i18n="nav_menu"></a>
        <a href="#why" data-i18n="nav_why"></a>
        <a href="#cook" data-i18n="nav_cook"></a>
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#delivery" data-i18n="nav_delivery"></a>
        <a href="#contacts" data-i18n="nav_contacts"></a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="ua">UA</button>
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <a class="icon-link" data-ig href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-.9a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
        </a>
        <a class="icon-link" data-wa-general href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.7L2 22l4.4-1.1A11 11 0 1 0 20.5 3.5z"/></svg>
        </a>
        <button class="menu-toggle" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="container nav-mobile">
      <a href="#menu" data-i18n="nav_menu"></a>
      <a href="#why" data-i18n="nav_why"></a>
      <a href="#cook" data-i18n="nav_cook"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#delivery" data-i18n="nav_delivery"></a>
      <a href="#reviews" data-i18n="nav_reviews"></a>
      <a href="#contacts" data-i18n="nav_contacts"></a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Antalya · Home Food</p>
          <h1>Casa Mia</h1>
          <p class="lead" data-i18n="hero_lead"></p>
          <ul class="hero-points">
            <li data-i18n="hero_p1"></li>
            <li data-i18n="hero_p2"></li>
            <li data-i18n="hero_p3"></li>
            <li data-i18n="hero_p4"></li>
          </ul>
          <div class="btn-row">
            <a class="btn btn-wa" data-wa-general href="#" target="_blank" rel="noopener" data-i18n="cta_wa"></a>
            <a class="btn btn-secondary" data-ig href="#" target="_blank" rel="noopener" data-i18n="cta_ig"></a>
          </div>
        </div>
        <div class="hero-media">
          <img src="images/products/ravioli-salmon.png" alt="Casa Mia ravioli" width="900" height="900">
          <div class="seal" data-i18n="seal"></div>
        </div>
      </div>
    </section>

    <section class="section" id="menu">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">Catalog</p>
          <h2 data-i18n="menu_title"></h2>
          <p data-i18n="menu_sub"></p>
        </div>

        <h3 style="font-family:var(--font-display);font-size:1.6rem;margin:0 0 1rem" data-i18n="hits_title"></h3>
        <div class="hits-row" id="hits"></div>

        <div class="filters" id="filters"></div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </section>

    <section class="section" id="why" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="why_title"></h2>
        </div>
        <div class="features" id="features"></div>
      </div>
    </section>

    <section class="section" id="cook">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="cook_title"></h2>
          <p data-i18n="cook_sub"></p>
        </div>
        <div class="cook-grid" id="cook-grid"></div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container split">
        <div class="split-media">
          <img src="images/products/pelmeni-chicken-beef.png" alt="Cooking process" width="800" height="800">
          <div class="script-note" id="about-title"></div>
        </div>
        <div>
          <p class="eyebrow">Casa Mia</p>
          <div id="about-text"></div>
          <div class="btn-row" style="margin-top:1.5rem">
            <a class="btn btn-primary" href="#menu" data-i18n="nav_menu"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="delivery">
      <div class="container">
        <div class="delivery-panel">
          <h2 data-i18n="delivery_title"></h2>
          <div class="delivery-list" id="delivery-list"></div>
        </div>
      </div>
    </section>

    <section class="section" id="reviews">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="reviews_title"></h2>
        </div>
        <div class="reviews" id="reviews-list"></div>
      </div>
    </section>

    <section class="section" id="contacts">
      <div class="container">
        <div class="final-cta">
          <h2 data-i18n="contacts_title"></h2>
          <p data-i18n="contacts_sub"></p>
          <div class="btn-row" style="justify-content:center">
            <a class="btn btn-wa" data-wa-general href="#" target="_blank" rel="noopener" data-i18n="cta_wa"></a>
            <a class="btn btn-secondary" data-ig href="#" target="_blank" rel="noopener" data-i18n="cta_ig"></a>
          </div>
          <p style="margin-top:1.25rem;opacity:.9">
            WhatsApp: <span id="wa-display"></span><br>
            Instagram: <span id="ig-display"></span>
          </p>
        </div>
      </div>
    </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="footer-brand">Casa Mia</div>
          <div class="footer-note" data-i18n="thanks"></div>
        </div>
        <div class="footer-links">
          <a href="#menu" data-i18n="nav_menu"></a>
          <a href="#about" data-i18n="nav_about"></a>
          <a href="#delivery" data-i18n="nav_delivery"></a>
          <a href="#contacts" data-i18n="nav_contacts"></a>
