name: Build indexable pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "js/seo.js"
      - "scripts/build-pages.js"
      - "css/style.css"

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build-pages.js
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml index.html p c ua tr en
          if git diff --cached --quiet; then
            echo "No page changes."
            exit 0
          fi
          git commit -m "Rebuild indexable pages from the catalog"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
